<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Flipbook</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ffebf0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .flipbook {
      perspective: 1500px;
    }

    .book {
      width: 300px;
      height: 400px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      transition: transform 1s;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      background: white;
      border: 1px solid #ccc;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      padding: 20px;
      text-align: center;
    }

    .page:nth-child(1) { z-index: 4; }
    .page:nth-child(2) { z-index: 3; transform: rotateY(180deg); }
    .page:nth-child(3) { z-index: 2; }
    .page:nth-child(4) { z-index: 1; transform: rotateY(180deg); }

    .flip {
      transform: rotateY(-180deg);
    }

    .controls {
      margin-top: 20px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      margin: 0 10px;
      cursor: pointer;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="flipbook">
    <div class="book" id="book">
      <div class="page">Happy Birthday 🎉</div>
      <div class="page">Wishing you lots of love and laughter 💖</div>
      <div class="page">May your day be as sweet as cake 🎂</div>
      <div class="page">Cheers to another amazing year! 🥳</div>
    </div>
  </div>
  <div class="controls">
    <button onclick="flipBook()">Flip Page</button>
  </div>

  <script>
    let flipped = false;
    function flipBook() {
      const book = document.getElementById('book');
      flipped = !flipped;
      book.className = flipped ? 'book flip' : 'book';
    }
  </script>
</body>
  </html>
